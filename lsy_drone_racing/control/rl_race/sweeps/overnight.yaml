# Shared 72-trial grid. Create once; join the SAME sweep ID from every host.
# 32768 envs / 8192 batch passed on RTX5090; larger batches OOM.
name: four-action-multihost-grid
program: lsy_drone_racing/control/rl_race/sweep.py
method: grid
run_cap: 72
metric:
  name: final/leaderboard_score
  goal: minimize
command:
- ${env}
- pixi
- run
- -e
- gpu
- python
- -m
- lsy_drone_racing.control.rl_race.sweep
parameters:
  start_stage:
    value: pretrain
  start_params:
    value: null
  seed:
    value: 1
  policy_layers:
    value:
    - 256
    - 256
    - 256
  value_layers:
    value:
    - 256
    - 256
    - 256
    - 256
  yaw_limit_deg:
    values:
    - 70
    - 80
    - 85
  official_start_prob:
    value: 0.5
  learning_rate:
    value: 0.0003
  policy_lr_after_switch:
    value: 0.0001
  entropy_cost:
    value: 0.005
  race_gate:
    value: 5
  race_lap:
    value: 10
  race_time:
    values:
    - 0.3
    - 0.4
  race_crash:
    value: 20
  pretrain_max_steps:
    value: 500000000
  pretrain_time:
    value: 0.2
  pretrain_crash:
    value: 20
  race_steps:
    value: 2500000000
  anneal_steps:
    values:
    - 0
    - 400000000
  final_eval_episodes:
    value: 1024
  final_eval_seeds:
    value:
    - 410000
    - 420000
    - 430000
  final_eval_batch_size:
    value: 256
  tilt_limit_deg:
    values:
    - 70
    - 75
    - 80
  n_gates:
    values:
    - 2
    - 3
  num_envs:
    value: 32768
  batch_size:
    value: 8192
  num_minibatches:
    value: 32
  unroll_length:
    value: 32
  upload_checkpoint:
    value: true
  sweep_trial_count:
    value: 72
  cloud_checkpoint_budget_gb:
    value: 50
