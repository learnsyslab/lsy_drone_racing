[build-system]
requires = ["setuptools>=61.0.0", "wheel", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsy_drone_racing"
version = "0.0.1"
description = "LSY Autonomous Drone Racing Project Course"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]


########################
# Pip Dependencies
########################
dependencies = [
    "fire >= 0.6.0",
    "numpy",
    "toml >= 0.10.2",
    "gymnasium[array-api] >= 1.2.0",
    "ml-collections >= 1.0",
    "packaging >= 24.0",
    "crazyflow >= 0.4",
    "mujoco>=3.3.0,<3.11.0", # unlock the mujoco version when gymnasium side is repaired
    "jax >= 0.7, < 0.12",
    "warp-lang",
    # PPO training and competition controller dependencies (available in default and gpu).
    "torch == 2.8.0",
    "wandb",
    "sbx-rl == 0.28.0",
    "stable-baselines3 >= 2.9.0, < 3",
    "flax >= 0.12.0, < 0.13",
    "optax >= 0.2.5, < 0.3",
    "tfp-nightly >= 0.26.0.dev20250831",
    "scipy >= 1.14",
]

[project.optional-dependencies]
# option[gpu]: simulation with gpu
gpu = ["jax[cuda12]"]
# option[deploy]: deploy to real drones
deploy = [
    "cflib2 @ git+https://github.com/bitcraze/crazyflie-lib-python-v2.git@d87b796",
    "drone-estimators>=0.1.0",
]
# Compatibility extra for the official .[rl] install and existing test environments.
# PPO dependencies are included in the base project dependencies above.
rl = []
# option[gamepad]: use a gamepad as input for your drone
gamepad = ["pygame"]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
lsy_drone_racing = [
    "envs/assets/*.xml", "envs/assets/*.png",
    "control/rl_single_l2/deploy_model/*",
]

[tool.pytest.ini_options]
markers = ["unit", "integration"]

########################
# Pixi Sessions
########################
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11.12,<3.14"
pip = ">=25.0.1,<26"
packaging = ">=24"
pygments = "*"
ruff = "*"

[tool.pixi.target.unix.dependencies]
# Compilers needed for acados
compilers = ">=1.9.0, <1.11.0"
cmake = "==3.26.0"  # Pinned for motion_capture_tracking
make = "==4.4.1"  # Pinned for motion_capture_tracking
openblas = ">=0.3.30,<0.4"

[tool.pixi.target.win-64.dependencies]
cmake = "==3.26.0"
vc14_runtime = "*"
gcc = ">=15,<16"
gxx = ">=15,<16"
binutils = "*"
make = "==4.4.1"

[tool.pixi.pypi-dependencies]
lsy_drone_racing = { path = ".", editable = true }

# Platform-specific acados setup.
[tool.pixi.feature.sim.target.unix.activation]
scripts = ["tools/setup_acados.sh"]

[tool.pixi.feature.sim.target.win-64.activation]
scripts = ["tools/setup_acados.bat"]

[tool.pixi.feature.gpu]
platforms = ["linux-64"]

# GPU-native PPO training (rl_race), only in training/test environments; not a package extra, so
# the default (competition) and deploy environments are unaffected. Brax main is pinned because no
# release yet supports jax >= 0.10 (0.14.2 still calls the removed jax.device_put_replicated).
[tool.pixi.feature.brax.pypi-dependencies]
brax = { git = "https://github.com/google/brax.git", rev = "c8605294264a7b7546268adbb4beabc9eb624000" }

[tool.pixi.tasks]
evaluate = { cmd = "python scripts/evaluate.py", description = "Evaluate the controller" }

### environments
[tool.pixi.environments]
default = { features = ["sim"], solve-group = "default" }
deploy = { features = ["sim", "gpu", "kilted", "deploy"] }
gpu = { features = ["sim", "gpu", "brax"], solve-group = "default" }
tests = { features = ["sim", "rl", "brax", "tests"], solve-group = "default" }
gpu-tests = { features = ["sim", "rl", "gpu", "brax", "tests"], solve-group = "default" }
gamepad = { features = ["sim", "gamepad"], solve-group = "default" }
profile = { features = ["sim", "profile", "gpu"], solve-group = "default" }
docs = { features = ["docs"] }

## feature [kilted]
[tool.pixi.feature.kilted]
platforms = ["linux-64"]
channels = ["https://prefix.dev/robostack-kilted"]

[tool.pixi.feature.kilted.dependencies]
# Build tools
pkg-config = "*"
ninja = "*"
# ROS specific tools
rosdep = "*"
colcon-common-extensions = "*"
# Kilted specific tools
ros-kilted-desktop = "*"
ros2-distro-mutex = "0.12.*"  # Pinned for motion_capture_tracking

[tool.pixi.feature.kilted.activation]
scripts = ["tools/setup_mocap.sh"]

[tool.pixi.feature.kilted.activation.env]
# Use Zenoh as ROS 2 middleware with multicast discovery across machines
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ZENOH_ROUTER_CHECK_ATTEMPTS = "-1"  # Do not check for a router when a node starts
ZENOH_CONFIG_OVERRIDE = 'listen/endpoints=["tcp/0.0.0.0:0"];scouting/multicast/enabled=true'
RUST_LOG = "zenoh=error"

## feature [deploy]
[tool.pixi.feature.deploy.tasks]
mocap = { cmd = "ros2 launch motion_capture_tracking launch.py", description = "Launch the motion capture tracking node" }
estimator = { cmd = "python -m drone_estimators.ros.node", description = "Start the drone state estimator" }

[tool.pixi.feature.deploy.dependencies]
packaging = ">=24,<26"  # Necessary for cflib2
maturin = ">=1.13.3,<2"
rust = ">=1.95.0,<1.96"

## feature [tests]
[tool.pixi.feature.tests.tasks]
tests = { cmd = "pytest -v tests", description = "Run tests" }

# Use PyPI pytest to avoid Conda-only transitive dependencies leaking across the solve group.
[tool.pixi.feature.tests.pypi-dependencies]
pytest = "*"

[tool.pixi.feature.profile.dependencies]
pyinstrument = "*"

## feature [docs]
[tool.pixi.feature.docs.dependencies]
python = ">=3.10"
properdocs = ">=1.5.0"
mkdocs-material = ">=9.0.0"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs-autorefs = ">=1.2.0"
mkdocstrings = { extras = ["python"], version = ">=0.26.0" }
mkdocs-gen-files = ">=0.5.0"
mkdocs-literate-nav = ">=0.6.0"
mkdocs-section-index = ">=0.3.0"
mkdocs-charts-plugin = ">=0.0.10"

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "properdocs build", description = "Build docs" }
docs-serve = { cmd = "properdocs serve --livereload", description = "Serve docs locally" }

########################
# Linting and formatting settings
########################
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
    # Verbatim upstream Brax code (plus one hook); kept in upstream style to stay diffable.
    "lsy_drone_racing/control/rl_race/brax_ppo_train.py",
]

line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "TCH", "ANN"]
ignore = ["ANN401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]  # Prevent ruff from reporting conflicting settings with isort
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["D100", "D103"]
"tests/*" = ["D100", "D103", "D104"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
